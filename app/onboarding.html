<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configura tu Negocio — oPOSsum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: var(--space-4);
    }
    .onboard-card {
      width: 100%;
      max-width: 480px;
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-2xl);
      padding: var(--space-8);
      box-shadow: var(--shadow-xl);
      text-align: center;
    }
    .step-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: var(--brand-50);
      color: var(--brand-700);
      border-radius: var(--radius-full);
      font-size: var(--font-size-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: var(--space-4);
    }
    .onboard-title {
      font-size: var(--font-size-2xl);
      font-weight: 800;
      color: var(--navy-900);
      margin-bottom: var(--space-2);
    }
    .onboard-subtitle {
      font-size: var(--font-size-sm);
      color: var(--gray-500);
      margin-bottom: var(--space-6);
      line-height: 1.6;
    }
    .form-group {
      margin-bottom: var(--space-4);
      text-align: left;
    }
    .form-label {
      display: block;
      font-size: var(--font-size-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--gray-700);
      margin-bottom: var(--space-1);
    }
    .form-input {
      width: 100%;
      padding: var(--space-3) var(--space-4);
      border: 1px solid var(--gray-300);
      border-radius: var(--radius-lg);
      font-size: var(--font-size-sm);
      font-family: inherit;
      outline: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }
    .form-input:focus {
      border-color: var(--brand-500);
      box-shadow: 0 0 0 3px rgba(0, 164, 174, 0.15);
    }
    .slug-preview {
      font-size: var(--font-size-xs);
      color: var(--gray-500);
      margin-top: var(--space-1);
    }
    .slug-preview strong {
      color: var(--brand-600);
    }
    .alert-box {
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-lg);
      font-size: var(--font-size-xs);
      margin-bottom: var(--space-4);
      display: none;
      text-align: left;
    }
    .alert-box.error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      display: block;
    }
  </style>
</head>
<body>

  <div class="onboard-card">
    <div class="step-badge">🚀 Paso 1 de 1</div>
    <h1 class="onboard-title">Crea tu Instancia de POS</h1>
    <p class="onboard-subtitle">Tu negocio tendrá un entorno completamente aislado con sus propios productos, ventas y configuraciones.</p>

    <div id="alert" class="alert-box"></div>

    <form id="onboard-form">
      <div class="form-group">
        <label class="form-label" for="biz-name">Nombre Comercial del Negocio</label>
        <input class="form-input" type="text" id="biz-name" required placeholder="Ej. Cafetería La Sierra">
      </div>

      <div class="form-group">
        <label class="form-label" for="biz-type">Tipo de Negocio *</label>
        <select class="form-input" id="biz-type" required style="cursor: pointer; background: white;">
          <option value="" disabled selected>Selecciona tu tipo de negocio...</option>
          <option value="Abarrotes y Minisúper">🏪 Abarrotes, Minisúper y Tiendita</option>
          <option value="Ropa y Calzado">👗 Ropa, Calzado y Boutiques</option>
          <option value="Restaurante y Cafetería">☕ Cafetería, Restaurante o Bar</option>
          <option value="Farmacia">💊 Farmacia y Salud</option>
          <option value="Ferretería">🔨 Ferretería y Materiales</option>
          <option value="Electrónica y Celulares">📱 Electrónica, Celulares y Cómputo</option>
          <option value="Belleza y Spa">💈 Barbería, Salón de Belleza y Spa</option>
          <option value="Papelería">📚 Papelería y Regalos</option>
          <option value="Panadería y Repostería">🥐 Panadería y Repostería</option>
          <option value="Servicios Profesionales">💼 Servicios Profesionales</option>
          <option value="Otro Comercio">📦 Otro Tipo de Negocio / Comercio</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="biz-slug">Identificador Único (Slug)</label>
        <input class="form-input" type="text" id="biz-slug" required placeholder="cafeteria-la-sierra">
        <div class="slug-preview">Identificador: <strong id="slug-text">cafeteria-la-sierra</strong></div>
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; padding: var(--space-3); font-size: var(--font-size-base); font-weight: 700; margin-top: var(--space-4);" id="btn-create">
        Crear Negocio y Entrar al POS
      </button>
    </form>
  </div>

  <script type="module">
    import { getSupabase } from '../js/supabase-client.js';
    import { tenantManager } from '../js/tenant-context.js';

    const supabase = getSupabase();

    // Ensure user is authenticated
    async function checkAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = 'auth.html';
        return;
      }

      // Check if user already has an active tenant
      const context = await tenantManager.init();
      if (!context.needsOnboarding && context.tenant) {
        window.location.href = 'dashboard.html';
      }
    }
    checkAuth();

    // Auto-generate slug from name
    const bizNameInput = document.getElementById('biz-name');
    const bizTypeInput = document.getElementById('biz-type');
    const bizSlugInput = document.getElementById('biz-slug');
    const slugText = document.getElementById('slug-text');
    const alertBox = document.getElementById('alert');
    const btnCreate = document.getElementById('btn-create');

    function cleanSlug(text) {
      return text
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9\-]/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
    }

    bizNameInput.addEventListener('input', () => {
      const slug = cleanSlug(bizNameInput.value);
      bizSlugInput.value = slug;
      slugText.textContent = slug || 'tu-negocio';
    });

    bizSlugInput.addEventListener('input', () => {
      const slug = cleanSlug(bizSlugInput.value);
      slugText.textContent = slug || 'tu-negocio';
    });

    document.getElementById('onboard-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const name = bizNameInput.value.trim();
      const type = bizTypeInput.value;
      const slug = cleanSlug(bizSlugInput.value.trim());

      if (!name) {
        alertBox.textContent = 'Por favor ingresa el nombre de tu negocio.';
        alertBox.className = 'alert-box error';
        return;
      }

      if (!type) {
        alertBox.textContent = 'Por favor selecciona el tipo de negocio (campo obligatorio).';
        alertBox.className = 'alert-box error';
        return;
      }

      if (!slug) {
        alertBox.textContent = 'Por favor ingresa un identificador para tu negocio.';
        alertBox.className = 'alert-box error';
        return;
      }

      btnCreate.disabled = true;
      btnCreate.textContent = 'Creando entorno aislado...';

      try {
        // Verify session before creating
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
          window.location.href = 'auth.html';
          return;
        }

        const result = await tenantManager.createTenant(name, slug, type);
        btnCreate.textContent = '¡Negocio creado! Entrando...';
        window.location.href = 'dashboard.html';
      } catch (err) {
        console.error('Onboarding error:', err);
        alertBox.textContent = err.message || 'Error al crear el negocio.';
        alertBox.className = 'alert-box error';
        btnCreate.disabled = false;
        btnCreate.textContent = 'Crear Negocio y Entrar al POS';
      }
    });
  </script>
</body>
</html>
